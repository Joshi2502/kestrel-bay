# Local Postgres only. Production uses Neon (see README).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kestrel_bay
      POSTGRES_USER: kestrel_bay
      POSTGRES_PASSWORD: kestrel_bay_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrel_bay"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
